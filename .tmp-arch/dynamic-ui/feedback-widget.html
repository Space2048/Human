<style>
:root {
  color-scheme: light;
  --surface: #F7F7F8;
  --surface-muted: #EFEFF2;
  --text: #171717;
  --text-muted: #52525B;
  --border: rgba(23, 23, 23, 0.12);
  --brand: #4B3FE3;
  --brand-soft: #F2F7FF;
  --brand-soft-strong: #E5EAFF;
  --brand-text: #1A1759;
  --brand-on: #FFFFFF;
  --chart-series-1: #3C2ECA;
  --chart-series-2: #A9AEFF;
  --chart-series-3: #6F6FFF;
  --chart-series-4: #22A5F7;
  --chart-other: #D3D4DA;
  --accent: #27D2BF;
  --accent-2: #F87454;
  --accent-soft: #EAFBF8;
  --accent-text: #0F766E;
  --success: #1DC981;
  --warning: #EFAA17;
  --danger: #E8463A;
  --radius: 8px;
  --radius-card: 12px;
  --radius-full: 999px;
  --spacer-4: 4px;
  --spacer-8: 8px;
  --spacer-12: 12px;
  --spacer-16: 16px;
  --spacer-20: 20px;
  --spacer-24: 24px;
  --font-sans: "SF Pro Text", "PingFang SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-metric: "Inter", "SF Pro Text", "PingFang SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --weight-regular: 400;
  --weight-medium: 500;
  --weight-strong: 600;
  --text-caption: 12px/18px;
  --text-body: 14px/20px;
  --text-title: 16px/24px;
  --text-code: 13px/20px;
}

:root[data-widget-theme="dark"] {
  color-scheme: dark;
  --surface: #171717;
  --surface-muted: #262626;
  --text: #E5E5E5;
  --text-muted: #A1A1AA;
  --border: rgba(229, 229, 229, 0.12);
  --brand: #6054F1;
  --brand-soft: #1A1759;
  --brand-soft-strong: #3C2ECA;
  --brand-text: #CFD8FF;
  --chart-series-1: #4B3FE3;
  --chart-other: #D3D4DA;
  --accent-soft: #123F3C;
  --accent-text: #CCFBF1;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-widget-theme]) {
    color-scheme: dark;
    --surface: #171717;
    --surface-muted: #262626;
    --text: #E5E5E5;
    --text-muted: #A1A1AA;
    --border: rgba(229, 229, 229, 0.12);
    --brand: #6054F1;
    --brand-soft: #1A1759;
    --brand-soft-strong: #3C2ECA;
    --brand-text: #CFD8FF;
    --chart-series-1: #4B3FE3;
    --chart-other: #D3D4DA;
    --accent-soft: #123F3C;
    --accent-text: #CCFBF1;
  }
}

.widget {
  color: var(--text);
  background: transparent;
  font: var(--weight-regular) var(--text-body) var(--font-sans);
  letter-spacing: 0;
  width: 100%;
  box-sizing: border-box;
}

.fbCard {
  box-sizing: border-box;
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  padding: var(--spacer-20);
}

.fbHeader {
  display: grid;
  gap: var(--spacer-4);
  margin-bottom: var(--spacer-16);
}

.fbTitle {
  margin: 0;
  color: var(--text);
  font: var(--weight-medium) var(--text-title) var(--font-sans);
}

.fbSub {
  margin: 0;
  color: var(--text-muted);
  font: var(--weight-regular) var(--text-caption) var(--font-sans);
}

.fbChart {
  width: 100%;
  overflow-x: auto;
}

.fbSvg {
  display: block;
  width: 100%;
  height: auto;
}

.boundary {
  fill: color-mix(in srgb, var(--surface) 60%, transparent);
  stroke: color-mix(in srgb, var(--text-muted) 55%, transparent);
  stroke-width: 1.2;
  stroke-dasharray: 6 5;
  rx: 12;
}

.boundaryName {
  fill: var(--text-muted);
  font: var(--weight-medium) var(--text-caption) var(--font-sans);
}

.node {
  fill: var(--surface);
  stroke: var(--border);
  stroke-width: 1.3;
  rx: 8;
}

.node.brand {
  fill: var(--brand-soft);
  stroke: var(--brand);
  stroke-width: 1.5;
}

.node.external {
  fill: var(--surface-muted);
  stroke: color-mix(in srgb, var(--text-muted) 45%, var(--border));
  stroke-width: 1.3;
  rx: 999;
}

.nodeLabel {
  fill: var(--text);
  font: var(--weight-medium) var(--text-body) var(--font-sans);
}

.node.brand .nodeLabel { fill: var(--brand-text); }

.nodeSub {
  fill: var(--text-muted);
  font: var(--weight-regular) var(--text-caption) var(--font-sans);
}

.node.brand .nodeSub { fill: var(--brand); }

.conn {
  fill: none;
  stroke: var(--text-muted);
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.conn.main {
  stroke: var(--brand);
  stroke-width: 1.8;
}

.conn.dashed {
  stroke-dasharray: 5 6;
  opacity: 0.8;
}

.arrowHead {
  fill: var(--text-muted);
}

.arrowHead.main {
  fill: var(--brand);
}

.edgeTag {
  fill: var(--surface);
  stroke: var(--border);
  stroke-width: 1;
  rx: 8;
}

.edgeTag.main {
  stroke: color-mix(in srgb, var(--brand) 45%, var(--border));
}

.edgeText {
  fill: var(--text);
  font: var(--weight-medium) var(--text-caption) var(--font-sans);
}

.edgeText.main { fill: var(--brand-text); }

.badge {
  fill: var(--brand);
  rx: 999;
}

.badgeText {
  fill: var(--brand-on);
  font: var(--weight-strong) var(--text-caption) var(--font-sans);
}

.fbFoot {
  margin-top: var(--spacer-12);
  color: var(--text-muted);
  font: var(--weight-regular) var(--text-caption) var(--font-sans);
}

@media (max-width: 520px) {
  .fbCard { padding: var(--spacer-16); }
}
</style>
